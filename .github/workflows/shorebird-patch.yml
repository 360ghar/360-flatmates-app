name: Shorebird Patch (OTA)

# Ships a Dart-only fix over the air to an already-released version, with no
# store review. Manual only — a patch is a deliberate operator action.
#
# BEFORE RUNNING: check out a branch cut from the release's `v*` tag and apply
# only the Dart fix on top. Patching from `main` drags in unrelated asset,
# native and dependency changes, which Shorebird will reject (or which will
# produce an enormous patch).
#
# What CANNOT be patched: assets, native code (Kotlin/Swift/Gradle/Podfile),
# plugin native changes, and the Flutter version. Those need a full `v*` release.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to patch'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both
      release_version:
        description: 'Release version to patch, e.g. 1.0.9+18. Leave blank to use the version in pubspec.yaml.'
        required: false
        type: string
      track:
        description: 'Track to publish to. Staging first — promote to stable only after verifying with `shorebird preview --track=staging`.'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - stable

jobs:
  patch_android:
    name: Patch Android
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true

      # A patch rebuilds the whole app to diff it against the release, so the
      # release keystore is required here exactly as it is for a release.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$KEYSTORE_FILE" \
            > android/app/key.properties

      # .env is a declared Flutter asset, so its bytes are part of the asset
      # bundle Shorebird diffs. This MUST be byte-identical to the stub written
      # by android-release.yml, or every patch reports spurious asset changes.
      - name: Stub optional .env asset
        run: |
          if [ ! -f .env ]; then
            printf 'APP_ENV=prod\n' > .env
          fi

      - run: flutter pub get

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RESOLVED="$INPUT_VERSION"
          else
            RESOLVED=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          fi
          if [ -z "$RESOLVED" ]; then
            echo "Could not resolve a release version." >&2
            exit 1
          fi
          echo "Patching release version: $RESOLVED"
          echo "release_version=$RESOLVED" >> "$GITHUB_OUTPUT"

      # --obfuscate is deliberately NOT passed: Shorebird downloads the release's
      # obfuscation map and applies it automatically, and passing the flag against
      # a non-obfuscated release is a fatal error.
      #
      # --flutter-version does not exist here — a patch always inherits the
      # Flutter revision of the release it targets.
      #
      # The dart-define set must stay byte-identical to android-release.yml. A
      # patch built with different defines ships a broken config: AppConfig
      # throws on an empty API_BASE_URL and the app boots into _ConfigErrorApp.
      #
      # No --allow-asset-diffs / --allow-native-diffs. On CI Shorebird cannot
      # prompt, so an unexpected diff fails this job loudly instead of silently
      # shipping a patch that may not match the release. Investigate locally
      # (scripts/shorebird_patch.sh) before ever adding those flags.
      - name: Shorebird patch (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          shorebird patch android \
            --release-version="$RELEASE_VERSION" \
            --track=${{ inputs.track }} \
            --split-debug-info=build/symbols \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=ENABLE_DEBUG_LOGS=false \
            -- \
            --no-tree-shake-icons

      - name: Upload patch debug symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patch-symbols-android
          path: build/symbols
          if-no-files-found: ignore

  patch_ios:
    name: Patch iOS
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
          cache: true

      # Byte-identical to the stub in ios-release.yml — see the Android job.
      - name: Stub optional .env asset
        run: |
          if [ ! -f .env ]; then
            printf 'APP_ENV=prod\n' > .env
          fi

      - run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true

      - name: Install certificates and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RESOLVED="$INPUT_VERSION"
          else
            RESOLVED=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          fi
          if [ -z "$RESOLVED" ]; then
            echo "Could not resolve a release version." >&2
            exit 1
          fi
          echo "Patching release version: $RESOLVED"
          echo "release_version=$RESOLVED" >> "$GITHUB_OUTPUT"

      # See the Android job for why --obfuscate and --flutter-version are absent
      # and why no --allow-*-diffs flags are set.
      - name: Shorebird patch (iOS)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          shorebird patch ios \
            --release-version="$RELEASE_VERSION" \
            --track=${{ inputs.track }} \
            --split-debug-info=build/symbols \
            --dart-define=APP_ENV=prod \
            --dart-define=APP_STORE_ID="$APP_STORE_ID" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=ENABLE_DEBUG_LOGS=false \
            -- \
            --no-tree-shake-icons

      - name: Upload patch debug symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patch-symbols-ios
          path: build/symbols
          if-no-files-found: ignore
