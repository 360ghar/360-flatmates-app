name: Maestro E2E Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  maestro_test:
    name: Run Maestro Flows (Android)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # Fail fast when a required secret is unset. Without this the APK builds
      # with empty config, AppConfig.fromEnvironment() throws, bootstrap.dart
      # renders _ConfigErrorApp, and the first flow dies on a login assertion
      # ("enter_phone_input" never appears) — which reads like a product bug
      # instead of the configuration error it is.
      - name: Preflight — required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          MAESTRO_PHONE: ${{ secrets.MAESTRO_PHONE }}
          MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
        run: |
          missing=()
          for name in API_BASE_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY MAESTRO_PHONE MAESTRO_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run this job."
            echo "API_BASE_URL must point at a seeded NON-production backend — these flows mutate state (likes, messages, visits, listings, blocks)."
            exit 1
          fi

          echo "All required secrets are present."

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION="cli-2.6.1"
          MAESTRO_BASE_URL="https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}"
          MAESTRO_ZIP="$RUNNER_TEMP/maestro.zip"
          CHECKSUMS_FILE="$RUNNER_TEMP/checksums_sha256.txt"

          curl -fsSL "$MAESTRO_BASE_URL/maestro.zip" -o "$MAESTRO_ZIP"
          curl -fsSL "$MAESTRO_BASE_URL/checksums_sha256.txt" -o "$CHECKSUMS_FILE"

          EXPECTED_CHECKSUM="$(grep 'maestro.zip$' "$CHECKSUMS_FILE" | awk '{print $1}')"
          ACTUAL_CHECKSUM="$(shasum -a 256 "$MAESTRO_ZIP" | awk '{print $1}')"

          if [ -z "$EXPECTED_CHECKSUM" ]; then
            echo "Unable to find maestro.zip checksum"
            exit 1
          fi

          if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
            echo "Maestro checksum mismatch"
            exit 1
          fi

          rm -rf "$HOME/.maestro-install"
          mkdir -p "$HOME/.maestro-install"
          unzip -q "$MAESTRO_ZIP" -d "$HOME/.maestro-install"
          echo "$HOME/.maestro-install/maestro/bin" >> "$GITHUB_PATH"

      - run: flutter pub get

      # .env is gitignored but declared as an asset in pubspec.yaml, so the file
      # must exist for the build. It is NOT the config source for CI — the app
      # config arrives through --dart-define on the build step below.
      - name: Stub optional .env asset
        run: |
          if [ ! -f .env ]; then
            printf 'APP_ENV=ci\n' > .env
          fi

      # Config must come from --dart-define: the stub .env above only carries
      # APP_ENV=ci. A debug APK built without these defines throws in
      # AppConfig.fromEnvironment() and boots into _ConfigErrorApp, so no flow
      # can reach the login screen.
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=ci \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # Grant the runner user access to /dev/kvm so the emulator boots under
      # KVM hardware acceleration (without this the action probes KVM, finds
      # no permission, and falls back to ~19-min software emulation).
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        env:
          MAESTRO_PHONE: ${{ secrets.MAESTRO_PHONE }}
          MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # ubuntu-22.04 + x86_64 + KVM (enabled above): hardware-accelerated
          # boot in ~1-2 min. macos-14/arm64-v8a never registered with adb;
          # without the KVM step above, ubuntu fell back to ~19-min software
          # emulation and the APK install then failed.
          emulator-boot-timeout: 900
          script: |
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            adb install build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/e2e.yaml --format junit --output maestro-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-report
          path: maestro-report.xml
