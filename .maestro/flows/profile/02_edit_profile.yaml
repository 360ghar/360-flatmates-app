appId: com.the360ghar.flatmates360
name: Profile - Edit Profile
tags:
  - profile
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- tapOn:
    id: nav_me_tab
- extendedWaitUntil:
    visible:
      id: profile_edit_button
    timeout: 5000
- scroll:
    direction: UP
- tapOn:
    id: profile_edit_button
- extendedWaitUntil:
    visible:
      id: profile_save_button
    timeout: 5000
- tapOn:
    id: profile_bio_input
- eraseText
- inputText: "Updated bio from Maestro E2E test."
- tapOn:
    id: profile_save_button
- extendedWaitUntil:
    visible:
      id: profile_edit_button
    timeout: 5000
