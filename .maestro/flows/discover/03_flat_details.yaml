appId: com.the360ghar.flatmates360
name: Flat Details - Open and Scroll
tags:
  - discover
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- extendedWaitUntil:
    visible:
      id: discover_feed_card_0
    timeout: 10000
- tapOn:
    id: discover_feed_card_0
- extendedWaitUntil:
    visible:
      id: flat_contact_button
    timeout: 5000
- assertVisible:
    id: flat_shortlist_button
- scroll
- scroll
# The two scrolls push the image carousel and its overlaid back button
# offscreen. `scroll` only goes down, so swipe back up to the top first.
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
# On-screen back button: Maestro's `back` works on Android only.
- tapOn:
    id: flat_back_button
- extendedWaitUntil:
    visible:
      id: home_search_bar
    timeout: 5000
