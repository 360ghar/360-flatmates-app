appId: com.the360ghar.flatmates360
name: Flat Details - Image Carousel Swipe
tags:
  - discover
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- extendedWaitUntil:
    visible:
      id: discover_feed_card_0
    timeout: 10000
- tapOn:
    id: discover_feed_card_0
- extendedWaitUntil:
    visible:
      id: flat_contact_button
    timeout: 5000
# `swipe LEFT` is not a Maestro command — the direction goes in the mapping.
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: RIGHT
- assertVisible:
    id: flat_contact_button
