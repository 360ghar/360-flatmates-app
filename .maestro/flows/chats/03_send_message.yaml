appId: com.the360ghar.flatmates360
name: Chats - Send message
tags:
  - chats
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- tapOn:
    id: nav_inbox_tab
- extendedWaitUntil:
    visible:
      id: chats_chats_tab
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: conversation_card_0
    timeout: 10000
- tapOn:
    id: conversation_card_0
- extendedWaitUntil:
    visible:
      id: chat_message_input
    timeout: 5000
- tapOn:
    id: chat_message_input
- inputText: "Hey, I'm interested in the room!"
- tapOn:
    id: chat_send_button
# One accessibility node per message holds the text, time and status, so
# match the text as a prefix ((?s) lets .* cross the line breaks).
- extendedWaitUntil:
    visible: "(?s)Hey, I'm interested in the room!.*"
    timeout: 5000
# On-screen back button: Maestro's `back` works on Android only.
- tapOn:
    id: nav_back_button
- extendedWaitUntil:
    visible:
      id: conversation_card_0
    timeout: 5000
