appId: com.the360ghar.flatmates360
name: Settings - Blocked Users
tags:
  - settings
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- tapOn:
    id: nav_me_tab
- extendedWaitUntil:
    visible:
      id: profile_edit_button
    timeout: 5000
- scrollUntilVisible:
    element:
      id: profile_settings_menu_item
    direction: DOWN
- tapOn:
    id: profile_settings_menu_item
- extendedWaitUntil:
    visible:
      id: settings_privacy_security_item
    timeout: 5000
- tapOn:
    id: settings_privacy_security_item
- extendedWaitUntil:
    visible:
      id: privacy_blocked_users_item
    timeout: 3000
- tapOn:
    id: privacy_blocked_users_item
# Blocked users page
- back
- extendedWaitUntil:
    visible:
      id: privacy_blocked_users_item
    timeout: 5000
