appId: com.the360ghar.flatmates360
name: Settings - Preferences Privacy
tags:
  - settings
---
- launchApp:
    clearState: true
- runFlow: ../_shared/login.yaml
- tapOn:
    id: nav_me_tab
- extendedWaitUntil:
    visible:
      id: profile_edit_button
    timeout: 5000
- scrollUntilVisible:
    element:
      id: preferences_menu_item
    direction: DOWN
- tapOn:
    id: preferences_menu_item
- extendedWaitUntil:
    visible:
      id: setting_hide_last_name
    timeout: 5000
- tapOn:
    id: setting_hide_last_name
- tapOn:
    id: setting_hide_location
- tapOn:
    id: setting_hide_last_name
- tapOn:
    id: setting_hide_location
- back
